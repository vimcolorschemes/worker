name: format

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Install go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.1
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Check format
        run: test -z $(gofmt -l .)
